<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sagrada light</title>
<meta name="description" content="The stained glass of Sagrada Familia, floating. One window at a time, its light and its reflection." />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sagrada light" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="main.css" />
</head>
<body>
<canvas id="scene" aria-label="A stained-glass window of Sagrada Familia floating on white. Swipe or use the arrow keys to change windows."></canvas>

<div id="dots" aria-hidden="true"></div>

<button id="gear" type="button" aria-label="Choose a window" aria-haspopup="dialog" aria-expanded="false">
    <i class="gi"><b></b><b></b><b></b><b></b></i><em>Windows</em>
</button>

<div id="panel" role="dialog" aria-label="Windows" hidden>
    <div id="panel-list" role="listbox" aria-label="Choose a window"></div>
    <div id="panel-note">The windows of Sagrada Familia, one at a time. Swipe to move between them.</div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
